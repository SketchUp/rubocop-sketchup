name: Tests

on:
  push:
    branches: [ main, master, dev/github-actions ]
    paths-ignore:
      - '**.md'
  # No path filters on pull requests: "All tests passed" is meant to be a
  # required check on main, and a skipped workflow would leave it pending and
  # block the merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  tests:
    name: >-
      OS ${{ matrix.os }}, Ruby ${{ matrix.ruby }}
    env:
      CI: true

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
        ruby: [ 2.7, 3.2, 3.4 ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        timeout-minutes: 10

      - name: Run rake
        timeout-minutes: 10
        run: bundle exec rake ci

  # Single check to require on main, so the test matrix can change without
  # updating the ruleset. Passes only if every job in the matrix passed.
  all-tests-passed:
    name: All tests passed
    if: always()
    needs: [ tests ]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
